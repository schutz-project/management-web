name: Schutz Management CD Connection Check

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Monitoring EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Check Management deployment through SSM
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json

          commands = [
              "set -eu",
              "echo MANAGEMENT_SSM_CONNECTED",
              "test -f /opt/schutz-monitoring/compose.ecr.yaml",
              "test \"$(docker inspect schutz-monitoring-management-web-1 --format '{{.State.Running}}')\" = true",
              "test \"$(docker inspect schutz-monitoring-management-worker-1 --format '{{.State.Running}}')\" = true",
              "test \"$(docker inspect schutz-monitoring-management-db-1 --format '{{.State.Health.Status}}')\" = healthy",
              "echo MANAGEMENT_CONTAINERS_OK",
              "WEB=$(docker inspect schutz-monitoring-management-web-1 --format '{{.Config.Image}}')",
              "WORKER=$(docker inspect schutz-monitoring-management-worker-1 --format '{{.Config.Image}}')",
              "case \"$WEB\" in *:sha-42a383810c16731985180190d7f9430074a7cdb9-39897334971-1) ;; *) exit 1 ;; esac",
              "case \"$WORKER\" in *:sha-a4cb6f75b9c4d47ae1fbb9587495c9b3469aeb7b-39897326854-1) ;; *) exit 1 ;; esac",
              "echo MANAGEMENT_IMAGES_MATCH",
              "echo NO_DEPLOYMENT_PERFORMED"
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYCODE

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
