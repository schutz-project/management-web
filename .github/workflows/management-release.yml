name: Schutz Management Manual Release

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Monitoring EC2 instance ID"
        required: true
        type: string
      mode:
        description: "CHECK does not change containers"
        required: true
        default: CHECK
        type: choice
        options:
          - CHECK
          - DEPLOY
      web_tag:
        description: "Immutable Management Web ECR tag"
        required: true
        default: sha-42a383810c16731985180190d7f9430074a7cdb9-39897334971-1
        type: string
      worker_tag:
        description: "Immutable Management Worker ECR tag"
        required: true
        default: sha-a4cb6f75b9c4d47ae1fbb9587495c9b3469aeb7b-39897326854-1
        type: string
      confirmation:
        description: "Type DEPLOY to change containers; leave empty for CHECK"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: schutz-management-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$MODE" == DEPLOY && "$CONFIRMATION" != DEPLOY ]]; then
            echo 'DEPLOY_CONFIRMATION_REQUIRED'
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2
      - name: Check or release through SSM
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          MODE: ${{ inputs.mode }}
          WEB_TAG: ${{ inputs.web_tag }}
          WORKER_TAG: ${{ inputs.worker_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, shlex
          from pathlib import Path
          iid=os.environ['INSTANCE_ID']
          assert iid == 'i-066c8eee143b5cdff', 'Monitoring instance required'
          args=[os.environ['MODE'],os.environ['WEB_TAG'],os.environ['WORKER_TAG']]
          script=Path('deploy/management-release.sh').read_bytes()
          b64=base64.b64encode(script).decode()
          cmd='printf %s '+shlex.quote(b64)+' | base64 -d | bash -s -- '+' '.join(map(shlex.quote,args))
          Path('ssm-params.json').write_text(json.dumps({'commands':['set -eu',cmd], 'executionTimeout':['1200']}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID"
          export COMMAND_ID
          python3 - <<'PYWAIT'
          import json, os, subprocess, time
          deadline = time.monotonic() + 1260
          while time.monotonic() < deadline:
              p = subprocess.run(
                  ['aws','ssm','get-command-invocation',
                   '--command-id',os.environ['COMMAND_ID'],
                   '--instance-id',os.environ['INSTANCE_ID'],
                   '--output','json','--no-cli-pager'],
                  capture_output=True, text=True, timeout=60)
              if p.returncode:
                  if 'InvocationDoesNotExist' not in p.stderr:
                      raise SystemExit(p.stderr)
              else:
                  data = json.loads(p.stdout)
                  status = data['Status']
                  print('SSM_STATUS=' + status, flush=True)
                  if status not in ('Pending','InProgress','Delayed','Cancelling'):
                      print(data.get('StandardOutputContent',''))
                      print(data.get('StandardErrorContent',''))
                      raise SystemExit(0 if status == 'Success' and data['ResponseCode'] == 0 else 1)
              time.sleep(10)
          raise SystemExit('SSM_RESULT_TIMEOUT: inspect ' + os.environ['COMMAND_ID'] + ' before retrying')
          PYWAIT
