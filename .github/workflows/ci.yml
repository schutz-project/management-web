name: Management Web CI

on:
  push:
    branches:
      - main
      - "setup/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    name: Docker build and import check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js for browser state regression tests
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check session restore and navigation behavior
        run: node --test tests/test-session-restore.cjs

      - name: Check integrated monitoring UI
        run: node --test tests/test-monitoring-ui.cjs

      - name: Install isolated browser review tools
        run: |
          mkdir -p "$RUNNER_TEMP/schutz-browser-tools"
          npm install --prefix "$RUNNER_TEMP/schutz-browser-tools" playwright@1.56.1
          "$RUNNER_TEMP/schutz-browser-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture incident UI and verify browser interactions
        env:
          NODE_PATH: ${{ runner.temp }}/schutz-browser-tools/node_modules
        run: node tests/capture-incident-ui.cjs

      - name: Verify dual-host browser interactions with local fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/schutz-browser-tools/node_modules
        run: |
          node tests/capture-dual-host-ui.cjs
          node --test tests/check-dual-host-browser-failures.cjs

      - name: Save isolated incident UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-ui-v31-review
          path: artifacts/incident-ui-v31/
          retention-days: 14

      - name: Check HTTP and HTTPS release health
        run: python3 tests/test_release_health.py

      - name: Validate deployment Compose metadata
        run: python3 tests/test_release_compose.py

      - name: Build Management Web image
        run: docker build -t schutz-management-web:ci .

      - name: Check Management Web imports
        run: >
          docker run --rm --network none
          schutz-management-web:ci
          python -c "import management.web; print('Management Web import OK')"

      - name: Check observability parity and partial failures
        run: >
          docker run --rm --network none
          -v "$PWD/tests:/tests:ro"
          schutz-management-web:ci
          python -m unittest discover -s /tests -p test_observability_parity.py

      - name: Check dual-host inventory and source timestamps
        run: >
          docker run --rm --network none
          -v "$PWD/tests:/tests:ro"
          schutz-management-web:ci
          python -m unittest discover -s /tests -p 'test_host_*.py'

      - name: Prometheus incident closure policy tests
        run: >
          docker run --rm --network none
          -v "$PWD/tests:/tests:ro"
          schutz-management-web:ci
          python -m unittest discover -s /tests -p test_prometheus_policy.py

      - name: Check authenticated incident actions and test closure
        run: >
          docker run --rm --network none
          -v "$PWD/tests:/tests:ro"
          schutz-management-web:ci
          python -m unittest discover -s /tests -p test_incident_actions.py

      - name: Check incident list filters and read-only metadata
        run: >
          docker run --rm --network none
          -v "$PWD/tests:/tests:ro"
          schutz-management-web:ci
          python -m unittest discover -s /tests -p test_incident_list.py

  publish-ecr:
    name: Publish image to ECR
    needs: [docker-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      AWS_REGION: ap-northeast-2
      REGISTRY: 527673188566.dkr.ecr.ap-northeast-2.amazonaws.com
      ECR_REPOSITORY: schutz/management-web
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push image
        id: image
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 \
            -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
